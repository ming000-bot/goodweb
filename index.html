<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 完善移动端视口，禁止缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M3U8播放器（支持Excel导入剧集）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #000;
            padding: 12px;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .control-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom:10px;
        }
        #m3u8-url {
            flex:1;
            min-width: 220px;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            padding: 12px 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background:#3366cc;
            color:#fff;
            font-size:15px;
            /* 移动端触控优化 */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        button:active{
            opacity:0.8;
        }
        #video-player {
            width: 100%;
            /* 响应式高度：电脑高，手机自适应 */
            aspect-ratio: 16 / 9;
            background: #111;
            margin-top: 10px;
            border-radius:6px;
        }
        .tips {
            color: #999;
            font-size: 13px;
            margin-top: 8px;
            line-height:1.5;
        }
        /* 下载进度条样式 */
        .progress {
            height: 10px;
            width: 100%;
            background-color: #1a1a1a;
            border-radius: 4px;
            margin: 10px 0;
            display: none;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #00ff9d;
            border-radius: 4px;
            transition: width 0.3s;
        }
        .status {
            margin-top: 10px;
            color: #00ff9d;
            font-size: 14px;
            word-break: break-all;
        }
        /* 剧集列表样式 */
        .episode-upload {
            margin: 20px 0;
            padding: 15px;
            background: #222;
            border-radius: 8px;
        }
        .episode-upload h3{
            margin-bottom:12px;
            font-size:18px;
        }
        .episode-list {
            margin: 15px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .episode-btn {
            padding: 10px 14px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size:15px;
            min-width:44px;
            /* 移动端点击区域 */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .episode-btn:hover {
            background: #0099ff;
            border-color: #0099ff;
        }
        .episode-btn.active {
            background: #00ff9d;
            border-color: #00ff9d;
            color: #000;
        }
        .excel-tips {
            color: #999;
            font-size: 12px;
            margin-top: 8px;
            line-height:1.5;
        }
        /* 媒体查询：手机小屏幕 */
        @media (max-width: 480px) {
            body{
                padding:8px;
            }
            button{
                padding:10px 12px;
                font-size:14px;
            }
            .episode-upload{
                padding:12px;
            }
        }
    </style>
    <!-- 播放依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.12/dist/hls.min.js"></script>
    <!-- 下载依赖（用于解析M3U8） -->
    <script src="https://cdn.jsdelivr.net/npm/m3u8-parser@latest/dist/m3u8-parser.min.js"></script>
    <!-- Excel解析依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="control-wrap">
        <input type="text" id="m3u8-url" value="" placeholder="粘贴M3U8链接">
        <button onclick="playVideo()">播放</button>
        <button onclick="downloadVideo()">下载TS分片</button>
        <button onclick="clearUrl()">清除</button>
    </div>
    <video id="video-player" controls></video>
    
    <!-- 下载进度 -->
    <div class="progress" id="progressBar">
        <div class="progress-bar" id="progressInner"></div>
    </div>
    <div class="status" id="statusText"></div>
    
    <!-- Excel导入剧集区域 -->
    <div class="episode-upload">
        <h3>剧集导入</h3>
        <input type="file" id="excelFile" accept=".xlsx,.xls" onchange="parseExcel(this)">
        <div class="episode-list" id="episodeList"></div>
        <div class="excel-tips">
            提示：Excel文件要求：第一列为剧集序号（1、2、3...），第二列为对应M3U8链接；支持.xlsx/.xls格式，仅解析第一个工作表
        </div>
    </div>
    
    <div class="tips">
        ⚠️提示：下载TS分片功能仅支持电脑端Chrome/Edge；手机浏览器不支持文件夹写入API。点击“下载TS分片”将选择保存位置后自动创建以日期时间命名的子文件夹，并逐个下载TS分片。
    </div>
    <script>
        // 全局变量
        let video = document.getElementById('video-player');
        let hls = null;
        let currentM3U8Url = '';
        // 下载进度元素
        const progressBar = document.getElementById('progressBar');
        const progressInner = document.getElementById('progressInner');
        const statusText = document.getElementById('statusText');
        // 输入框元素
        const urlInput = document.getElementById('m3u8-url');
        // 剧集相关变量
        const episodeList = document.getElementById('episodeList');
        let episodeMap = new Map(); // 存储 集数:链接 的映射

        // 播放函数
        function playVideo(playUrl) {
            const url = playUrl || urlInput.value.trim();
            if (!url) {
                alert('请输入M3U8链接！');
                return;
            }
            urlInput.value = url;
            currentM3U8Url = url;
            if (hls) hls.destroy();
            video.src = '';
            // HLS判断
            if (!Hls.isSupported()) {
                // 原生支持hls的Safari
                video.src = url;
                video.load();
                video.play().catch(e=>console.log(e));
                return;
            }
            hls = new Hls({
                // 移动端优化配置，降低缓冲卡顿
                lowLatencyMode: true,
                maxBufferLength: 20,
                maxMaxBufferLength:30
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(err => {
                    console.log('自动播放失败，手动点击播放器播放即可：', err);
                });
            });
            hls.on(Hls.Events.ERROR, (e, d) => {
                const fatalErrorCodes = [Hls.ErrorCodes.NETWORK_ERROR, Hls.ErrorCodes.MANIFEST_ERROR];
                if (fatalErrorCodes.includes(d.error.code)) {
                    alert('播放失败：' + d.error.message);
                } else {
                    console.log('播放非致命错误：', d.error.message);
                }
            });
            updateEpisodeActiveStatus(url);
        }

        // 下载TS分片到用户选择的文件夹（自动创建日期时间子文件夹）
        async function downloadVideo() {
            const url = currentM3U8Url || urlInput.value.trim();
            if (!url) {
                alert('请先输入并播放M3U8链接！');
                return;
            }
            // 检查浏览器是否支持 File System Access API
            if (!('showDirectoryPicker' in window)) {
                alert('⚠️当前浏览器不支持文件夹下载，该功能仅电脑Chrome/Edge可用，手机浏览器不支持！');
                return;
            }
            progressBar.style.display = 'block';
            progressInner.style.width = '0%';
            statusText.textContent = '正在解析M3U8文件...';
            try {
                // 1. 解析M3U8获取分片列表
                const m3u8Response = await fetch(url);
                if (!m3u8Response.ok) throw new Error('M3U8文件获取失败');
                const m3u8Text = await m3u8Response.text();
                const parser = new m3u8Parser.Parser();
                parser.push(m3u8Text);
                parser.end();
                const segments = parser.manifest.segments;
                if (!segments || segments.length === 0) throw new Error('未找到TS分片');
                const baseUrl = url.substring(0, url.lastIndexOf('/') + 1);
                const tsUrls = segments.map(seg => new URL(seg.uri, url).href); // 使用URL对象修复相对路径bug
                const total = tsUrls.length;
                // 2. 弹出文件夹选择器
                statusText.textContent = '请选择保存位置...';
                const rootDir = await window.showDirectoryPicker({ mode: 'readwrite' });
                
                // 3. 创建日期时间命名的子文件夹
                const now = new Date();
                const dateStr =
                    now.getFullYear() +
                    String(now.getMonth()+1).padStart(2,'0') +
                    String(now.getDate()).padStart(2,'0') + '_' +
                    String(now.getHours()).padStart(2,'0') +
                    String(now.getMinutes()).padStart(2,'0') +
                    String(now.getSeconds()).padStart(2,'0');
                const folderName = `m3u8_ts_${dateStr}`;
                let targetDir;
                try {
                    targetDir = await rootDir.getDirectoryHandle(folderName, { create: true });
                } catch (e) {
                    throw new Error('无法创建文件夹：' + e.message);
                }
                // 4. 逐个下载并写入文件
                let downloaded = 0;
                statusText.textContent = `开始下载 ${total} 个TS分片到文件夹 "${folderName}" ...`;
                for (let i = 0; i < tsUrls.length; i++) {
                    const tsUrl = tsUrls[i];
                    const response = await fetch(tsUrl);
                    if (!response.ok) throw new Error(`分片 ${i+1} 下载失败`);
                    const blob = await response.blob();
                    // 文件名：segment_0001.ts 格式（补零）
                    const fileName = `segment_${String(i+1).padStart(4, '0')}.ts`;
                    const fileHandle = await targetDir.getFileHandle(fileName, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    downloaded++;
                    const progress = Math.floor((downloaded / total) * 100);
                    progressInner.style.width = `${progress}%`;
                    statusText.textContent = `已下载 ${downloaded}/${total} 个分片 (${fileName})`;
                }
                progressInner.style.width = '100%';
                statusText.textContent = `全部 ${total} 个分片已保存到文件夹：${folderName}`;
            } catch (error) {
                // 用户取消选择或其他错误
                if (error.name === 'AbortError' || error.message.includes('abort')) {
                    statusText.textContent = '用户取消了文件夹选择';
                } else {
                    statusText.textContent = `下载失败: ${error.message}`;
                    console.error('下载失败：', error);
                }
            } finally {
                setTimeout(() => {
                    progressBar.style.display = 'none';
                }, 5000);
            }
        }

        // 清除
        function clearUrl() {
            urlInput.value = '';
            currentM3U8Url = '';
            if (video) {
                video.pause();
                video.src = '';
                video.load();
            }
            if (hls) {
                hls.destroy();
                hls = null;
            }
            progressBar.style.display = 'none';
            progressInner.style.width = '0%';
            statusText.textContent = '';
            episodeList.innerHTML = '';
            episodeMap.clear();
            alert('已成功清除M3U8地址并停止播放！');
        }

        // 解析Excel
        function parseExcel(fileInput) {
            const file = fileInput.files[0];
            if (!file) return;
            const fileExt = file.name.split('.').pop().toLowerCase();
            if (!['xlsx', 'xls'].includes(fileExt)) {
                alert('请上传.xlsx或.xls格式的Excel文件！');
                fileInput.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: ['episode', 'url'] });
                    const validData = jsonData.filter(item => {
                        return item.episode && item.url &&
                               !isNaN(Number(item.episode)) &&
                               item.url.trim().startsWith('http');
                    });
                    if (validData.length === 0) {
                        alert('Excel中未找到有效的剧集数据！请检查格式：第一列是数字序号，第二列是M3U8链接');
                        return;
                    }
                    validData.sort((a, b) => Number(a.episode) - Number(b.episode));
                    episodeList.innerHTML = '';
                    episodeMap.clear();
                    validData.forEach(item => {
                        const episodeNum = Number(item.episode);
                        const m3u8Url = item.url.trim();
                        episodeMap.set(episodeNum, m3u8Url);
                        const btn = document.createElement('button');
                        btn.className = 'episode-btn';
                        btn.innerText = episodeNum;
                        btn.onclick = function() {
                            playVideo(m3u8Url);
                        };
                        episodeList.appendChild(btn);
                    });
                    alert(`成功导入 ${validData.length} 集剧集链接！`);
                } catch (error) {
                    console.error('解析Excel失败：', error);
                    alert('Excel解析失败，请检查文件格式或内容是否正确！');
                } finally {
                    fileInput.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 更新剧集按钮激活状态
        function updateEpisodeActiveStatus(currentUrl) {
            const allBtns = document.querySelectorAll('.episode-btn');
            allBtns.forEach(btn => btn.classList.remove('active'));
            for (const [num, url] of episodeMap.entries()) {
                if (url === currentUrl) {
                    const targetBtn = Array.from(allBtns).find(btn => btn.innerText == num);
                    if (targetBtn) targetBtn.classList.add('active');
                    break;
                }
            }
        }
    </script>
</body>
</html>
